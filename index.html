<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sjakk · spill med venner</title>
<style>
  *{box-sizing:border-box}
  :root{
    --size: min(92vw, 520px);
    --light:#f0d9b5;
    --dark:#b58863;
    --accent:#4cc9f0;
    --panel:rgba(255,255,255,.045);
    --line:rgba(255,255,255,.09);
  }
  @media (min-width:900px){ :root{ --size: min(80vh, 600px); } }
  html,body{height:100%}
  body{
    margin:0;padding:22px 16px;min-height:100%;
    display:flex;justify-content:center;align-items:flex-start;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    color:#e6edf3;
    background:
      radial-gradient(1000px 700px at 15% -10%, #1c2b4a 0%, transparent 60%),
      radial-gradient(800px 600px at 90% 110%, #1a3a35 0%, transparent 55%),
      #0a0d13;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{display:flex;gap:26px;align-items:flex-start;flex-wrap:wrap;justify-content:center}
  .board-area{display:flex;flex-direction:column;gap:8px}

  .statusbar{
    display:flex;align-items:center;gap:9px;
    padding:9px 14px;border-radius:12px;
    background:var(--panel);border:1px solid var(--line);
    font-size:14px;font-weight:500;color:#c9d6e3;
    backdrop-filter:blur(10px);
  }
  .dot{width:9px;height:9px;border-radius:50%;background:#5a6474;flex:none;transition:.25s}
  .dot.ok{background:#3ddc84;box-shadow:0 0 10px #3ddc84}
  .dot.wait{background:#ffb703;box-shadow:0 0 10px #ffb703;animation:pulse 1.4s infinite}
  .dot.err{background:#ef476f;box-shadow:0 0 10px #ef476f}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

  .captured{display:flex;flex-wrap:wrap;align-items:center;gap:0 1px;min-height:26px;padding:0 4px;font-size:19px;line-height:1;opacity:.9}
  .cap-w{color:#f4f6f8;text-shadow:0 0 1px #333,0 1px 2px rgba(0,0,0,.6)}
  .cap-b{color:#111;text-shadow:0 0 1px #bbb,0 1px 2px rgba(0,0,0,.35)}

  .board{
    width:var(--size);height:var(--size);
    display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);
    border-radius:12px;overflow:hidden;
    box-shadow:0 26px 70px rgba(0,0,0,.65), 0 0 0 1px rgba(255,255,255,.07);
    user-select:none;touch-action:manipulation;
  }
  .square{position:relative;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .light{background:var(--light)}
  .dark{background:var(--dark)}
  .square::before{content:"";position:absolute;inset:0;pointer-events:none;background:transparent;transition:background .12s}
  .square.last::before{background:rgba(255,214,64,.38)}
  .square.selected::before{background:rgba(76,201,240,.55)}
  .square.check::before{background:radial-gradient(circle,rgba(239,71,111,.9),rgba(239,71,111,0) 72%)}
  .square.legal::after{content:"";position:absolute;width:30%;height:30%;border-radius:50%;background:rgba(0,0,0,.22);pointer-events:none}
  .square.legal-cap::after{content:"";position:absolute;inset:0;border-radius:0;background:transparent;box-shadow:inset 0 0 0 6px rgba(0,0,0,.22);pointer-events:none}

  .piece{
    position:relative;z-index:2;pointer-events:none;
    font-size:calc(var(--size)/8*0.84);line-height:1;
    transition:transform .08s;
  }
  .piece.w{color:#fff;text-shadow:0 0 1px #2b2b2b,0 1px 0 #2b2b2b,0 -1px 0 #2b2b2b,1px 0 0 #2b2b2b,-1px 0 0 #2b2b2b,0 3px 5px rgba(0,0,0,.45)}
  .piece.b{color:#15181c;text-shadow:0 0 1px #cfd6dd,0 3px 5px rgba(0,0,0,.4)}
  .square:hover .piece{transform:scale(1.05)}

  .coord{position:absolute;font-size:calc(var(--size)/8*0.2);font-weight:700;opacity:.5;pointer-events:none;z-index:1}
  .coord.file{right:3px;bottom:1px}
  .coord.rank{left:3px;top:1px}
  .light .coord{color:#8a6a45}
  .dark .coord{color:#f2e2c8}

  .panel{
    width:310px;padding:22px;border-radius:18px;
    background:var(--panel);border:1px solid var(--line);
    backdrop-filter:blur(14px);
    box-shadow:0 26px 70px rgba(0,0,0,.5);
  }
  h1{margin:0;font-size:22px;letter-spacing:-.4px}
  h1 span{background:linear-gradient(90deg,#4cc9f0,#7bf1a8);-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{margin:4px 0 18px;font-size:13px;color:#8b98a8}

  .btn{
    font:inherit;font-weight:600;font-size:14px;cursor:pointer;
    padding:11px 16px;border-radius:11px;border:1px solid var(--line);
    background:rgba(255,255,255,.07);color:#e6edf3;transition:.16s;
  }
  .btn:hover{background:rgba(255,255,255,.13);transform:translateY(-1px)}
  .btn:active{transform:translateY(0)}
  .btn.primary{
    width:100%;border:none;color:#04121a;
    background:linear-gradient(135deg,#4cc9f0,#7bf1a8);
    box-shadow:0 8px 24px rgba(76,201,240,.28);
  }
  .btn.primary:hover{box-shadow:0 12px 30px rgba(76,201,240,.4)}
  .btn.danger{color:#ff9db0;border-color:rgba(239,71,111,.35)}
  .btn.danger:hover{background:rgba(239,71,111,.16)}
  .btn.small{padding:8px 12px;font-size:13px;border-radius:9px}

  .join{display:flex;gap:8px;margin-top:10px}
  input{
    flex:1;min-width:0;font:inherit;font-size:15px;font-weight:700;letter-spacing:3px;text-transform:uppercase;
    padding:11px 12px;border-radius:11px;
    background:rgba(0,0,0,.35);border:1px solid var(--line);color:#e6edf3;outline:none;
  }
  input::placeholder{letter-spacing:1px;font-weight:500;color:#66707e}
  input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(76,201,240,.15)}

  .label{font-size:11px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:#7d8b9c}
  .room-info{margin-top:18px;padding:14px;border-radius:13px;background:rgba(76,201,240,.08);border:1px solid rgba(76,201,240,.22);text-align:center}
  .code{font-size:30px;font-weight:800;letter-spacing:7px;color:#9be7ff;margin:5px 0 10px;font-variant-numeric:tabular-nums}
  .color-note{font-size:12.5px;color:#9fb2c4;margin-bottom:10px}

  .moves{margin-top:18px}
  .move-list{
    margin-top:7px;height:150px;overflow-y:auto;font-size:13.5px;
    border-radius:11px;background:rgba(0,0,0,.28);border:1px solid var(--line);
    padding:8px;font-variant-numeric:tabular-nums;
  }
  .mv{display:grid;grid-template-columns:30px 1fr 1fr;gap:4px;padding:3px 5px;border-radius:6px}
  .mv:nth-child(odd){background:rgba(255,255,255,.035)}
  .mv .num{color:#6d7b8c;font-weight:700}
  .move-list::-webkit-scrollbar{width:6px}
  .move-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:3px}

  .game-btns{display:flex;gap:8px;margin-top:16px}
  .game-btns .btn{flex:1}

  .hidden{display:none !important}

  .modal{position:fixed;inset:0;background:rgba(4,7,12,.72);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:50}
  .modal-card{background:#141b25;border:1px solid var(--line);border-radius:18px;padding:22px 26px;box-shadow:0 30px 80px rgba(0,0,0,.7);text-align:center}
  .modal-card p{margin:0 0 14px;font-weight:600;color:#c9d6e3}
  .promo-row{display:flex;gap:10px}
  .promo-btn{
    width:64px;height:64px;font-size:38px;line-height:1;cursor:pointer;
    border-radius:13px;border:1px solid var(--line);background:rgba(255,255,255,.07);
    display:flex;align-items:center;justify-content:center;transition:.15s;
  }
  .promo-btn:hover{background:rgba(76,201,240,.22);border-color:var(--accent);transform:translateY(-2px)}
  .promo-btn.w{color:#fff;text-shadow:0 0 1px #222,0 2px 3px rgba(0,0,0,.5)}
  .promo-btn.b{color:#15181c;text-shadow:0 0 1px #bbb}
</style>
</head>
<body>

<div class="wrap">
  <div class="board-area">
    <div class="statusbar"><span class="dot" id="dot"></span><span id="status">Opprett eller bli med i et rom</span></div>
    <div class="captured" id="capTop"></div>
    <div class="board" id="board"></div>
    <div class="captured" id="capBottom"></div>
  </div>

  <aside class="panel">
    <h1><span>Sjakk</span></h1>
    <p class="sub">Spill mot en venn – del en romkode.</p>

    <div id="lobby">
      <button id="hostBtn" class="btn primary">Opprett rom</button>
      <div class="join">
        <input id="roomInput" maxlength="5" placeholder="Romkode" autocomplete="off" spellcheck="false">
        <button id="joinBtn" class="btn">Bli med</button>
      </div>
    </div>

    <div id="roomInfo" class="room-info hidden">
      <div class="label">Romkode</div>
      <div class="code" id="codeText">—</div>
      <div class="color-note" id="colorText"></div>
      <button id="copyBtn" class="btn small">Kopier kode</button>
    </div>

    <div class="moves">
      <div class="label">Trekk</div>
      <div class="move-list" id="moveList">—</div>
    </div>

    <div class="game-btns hidden" id="gameBtns">
      <button id="rematchBtn" class="btn small">Nytt spill</button>
      <button id="resignBtn" class="btn small danger">Gi opp</button>
    </div>
  </aside>
</div>

<div id="promo" class="modal hidden">
  <div class="modal-card">
    <p>Velg forvandling</p>
    <div class="promo-row" id="promoRow"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chess.js@0.13.4/chess.js"></script>
<script>
if (typeof Chess === 'undefined') {
  document.write('<script src="https://unpkg.com/chess.js@0.13.4/chess.js"><\/script>');
}
</script>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
(function () {
  'use strict';

  /* ---------- Konstanter ---------- */
  const FILES = 'abcdefgh';
  const GLYPH = { k:'♚', q:'♛', r:'♜', b:'♝', n:'♞', p:'♟' };
  const START_COUNT = { p:8, n:2, b:2, r:2, q:1, k:1 };
  const PEER_PREFIX = 'sjk1-';

  /* ---------- DOM ---------- */
  const boardEl   = document.getElementById('board');
  const statusEl  = document.getElementById('status');
  const dotEl     = document.getElementById('dot');
  const capTop    = document.getElementById('capTop');
  const capBottom = document.getElementById('capBottom');
  const moveList  = document.getElementById('moveList');
  const lobbyEl   = document.getElementById('lobby');
  const roomInfo  = document.getElementById('roomInfo');
  const codeText  = document.getElementById('codeText');
  const colorText = document.getElementById('colorText');
  const gameBtns  = document.getElementById('gameBtns');
  const promoEl   = document.getElementById('promo');
  const promoRow  = document.getElementById('promoRow');

  /* ---------- Tilstand ---------- */
  const chess = new Chess();
  let myColor = null;
  let roomCode = null;
  let peer = null;
  let conn = null;
  let connected = false;
  let selected = null;
  let legalTargets = new Set();
  let lastMove = null;
  let flipped = false;
  let pendingPromo = null;
  let resignMsg = null;
  let statusOverride = null;

  /* ---------- Hjelpere ---------- */
  function setStatus(t) { statusOverride = t; statusEl.textContent = t; }

  function dotState(s) { dotEl.className = 'dot ' + s; }

  function randomCode() {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let s = '';
    for (let i = 0; i < 5; i++) s += chars[Math.floor(Math.random() * chars.length)];
    return s;
  }

  function kingSquare(color) {
    for (const row of chess.board()) for (const sq of row) {
      if (sq && sq.type === 'k' && sq.color === color) return sq.square;
    }
    return null;
  }

  function endText() {
    if (chess.in_checkmate()) return 'Sjakkmatt! ' + (chess.turn() === 'w' ? 'Svart' : 'Hvit') + ' vant 🏆';
    if (chess.in_stalemate()) return 'Patt – uavgjort';
    if (chess.insufficient_material()) return 'Uavgjort – for lite materiale';
    if (chess.in_threefold_repetition && chess.in_threefold_repetition()) return 'Uavgjort – tre gangers repetisjon';
    if (chess.in_draw()) return 'Uavgjort';
    return 'Spillet er over';
  }

  function updateStatus() {
    if (!connected) {
      statusEl.textContent = statusOverride || (roomCode ? 'Venter på motstander …' : 'Opprett eller bli med i et rom');
      return;
    }
    if (resignMsg) { statusEl.textContent = resignMsg; return; }
    if (chess.game_over()) { statusEl.textContent = endText(); return; }
    if (chess.turn() === myColor) {
      statusEl.textContent = 'Din tur' + (chess.in_check() ? ' – du er i sjakk!' : '');
    } else {
      statusEl.textContent = 'Motstanderens tur' + (chess.in_check() ? ' – motstanderen er i sjakk' : '');
    }
  }

  /* ---------- Rendering ---------- */
  function render() {
    boardEl.innerHTML = '';
    const board = chess.board();
    const checkSq = (!chess.game_over() && chess.in_check()) ? kingSquare(chess.turn()) : null;

    const cells = [];
    for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) cells.push([r, c]);
    if (flipped) cells.reverse();

    cells.forEach(function (rc, i) {
      const r = rc[0], c = rc[1];
      const name = FILES[c] + (8 - r);
      const el = document.createElement('div');
      el.className = 'square ' + ((r + c) % 2 === 0 ? 'light' : 'dark');

      if (name === selected) el.classList.add('selected');
      if (lastMove && (name === lastMove.from || name === lastMove.to)) el.classList.add('last');
      if (name === checkSq) el.classList.add('check');
      if (legalTargets.has(name)) el.classList.add(board[r][c] ? 'legal-cap' : 'legal');

      const p = board[r][c];
      if (p) {
        const s = document.createElement('span');
        s.className = 'piece ' + (p.color === 'w' ? 'w' : 'b');
        s.textContent = GLYPH[p.type];
        el.appendChild(s);
      }

      const dispRow = Math.floor(i / 8), dispCol = i % 8;
      if (dispRow === 7) {
        const f = document.createElement('span');
        f.className = 'coord file';
        f.textContent = flipped ? FILES[7 - dispCol] : FILES[dispCol];
        el.appendChild(f);
      }
      if (dispCol === 0) {
        const rk = document.createElement('span');
        rk.className = 'coord rank';
        rk.textContent = flipped ? (dispRow + 1) : (8 - dispRow);
        el.appendChild(rk);
      }

      el.addEventListener('click', function () { onSquare(name); });
      boardEl.appendChild(el);
    });

    renderMoves();
    renderCaptured();
    updateStatus();
  }

  function renderMoves() {
    const h = chess.history();
    if (!h.length) { moveList.textContent = '—'; return; }
    let html = '';
    for (let i = 0; i < h.length; i += 2) {
      html += '<div class="mv"><span class="num">' + (i / 2 + 1) + '.</span>' +
              '<span>' + (h[i] || '') + '</span>' +
              '<span>' + (h[i + 1] || '') + '</span></div>';
    }
    moveList.innerHTML = html;
    moveList.scrollTop = moveList.scrollHeight;
  }

  function renderCaptured() {
    const alive = { w: {}, b: {} };
    ['w', 'b'].forEach(function (c) { for (const t in START_COUNT) alive[c][t] = 0; });
    chess.board().forEach(function (row) {
      row.forEach(function (s) { if (s) alive[s.color][s.type]++; });
    });

    const missing = { w: [], b: [] };
    ['w', 'b'].forEach(function (c) {
      ['q', 'r', 'b', 'n', 'p'].forEach(function (t) {
        const n = START_COUNT[t] - alive[c][t];
        for (let i = 0; i < n; i++) missing[c].push(t);
      });
    });

    const bottomColor = flipped ? 'w' : 'b';
    const topColor = flipped ? 'b' : 'w';

    function draw(el, list, color) {
      el.innerHTML = '';
      list.forEach(function (t) {
        const s = document.createElement('span');
        s.className = 'cap-' + color;
        s.textContent = GLYPH[t];
        el.appendChild(s);
      });
    }
    draw(capTop, missing[bottomColor], bottomColor);   // tatt av spilleren øverst
    draw(capBottom, missing[topColor], topColor);      // tatt av spilleren nederst
  }

  /* ---------- Spillogikk ---------- */
  function onSquare(name) {
    if (!connected || !myColor) return;
    if (chess.game_over() || resignMsg) return;
    if (chess.turn() !== myColor) return;
    if (pendingPromo) return;

    if (selected && legalTargets.has(name)) {
      const opts = chess.moves({ square: selected, verbose: true }).filter(function (m) { return m.to === name; });
      if (opts.some(function (m) { return !!m.promotion; })) {
        pendingPromo = { from: selected, to: name };
        openPromo(chess.turn());
        return;
      }
      makeMove({ from: selected, to: name });
      return;
    }

    const p = chess.get(name);
    if (p && p.color === myColor) {
      selected = name;
      legalTargets = new Set(chess.moves({ square: name, verbose: true }).map(function (m) { return m.to; }));
    } else {
      selected = null;
      legalTargets = new Set();
    }
    render();
  }

  function makeMove(move) {
    let res = null;
    try { res = chess.move(move); } catch (e) { res = null; }
    if (!res) { selected = null; legalTargets = new Set(); render(); return; }

    selected = null;
    legalTargets = new Set();
    lastMove = { from: res.from, to: res.to };
    render();

    const payload = { from: res.from, to: res.to };
    if (res.promotion) payload.promotion = res.promotion;
    send({ type: 'move', move: payload });
  }

  function openPromo(color) {
    promoRow.innerHTML = '';
    ['q', 'r', 'b', 'n'].forEach(function (t) {
      const b = document.createElement('button');
      b.className = 'promo-btn ' + (color === 'w' ? 'w' : 'b');
      b.textContent = GLYPH[t];
      b.addEventListener('click', function () {
        const mv = { from: pendingPromo.from, to: pendingPromo.to, promotion: t };
        pendingPromo = null;
        promoEl.classList.add('hidden');
        makeMove(mv);
      });
      promoRow.appendChild(b);
    });
    promoEl.classList.remove('hidden');
  }

  promoEl.addEventListener('click', function (e) {
    if (e.target === promoEl) { pendingPromo = null; promoEl.classList.add('hidden'); render(); }
  });

  function resetGame(broadcast) {
    chess.reset();
    selected = null;
    legalTargets = new Set();
    lastMove = null;
    resignMsg = null;
    pendingPromo = null;
    promoEl.classList.add('hidden');
    render();
    if (broadcast) send({ type: 'reset' });
  }

  /* ---------- Nettverk ---------- */
  function send(obj) {
    if (conn && conn.open) { try { conn.send(obj); } catch (e) {} }
  }

  function attachConn(c) {
    c.on('open', function () {
      if (c !== conn) return;
      connected = true;
      resignMsg = null;
      statusOverride = null;
      dotState('ok');
      render();
    });
    c.on('data', function (d) { if (c === conn) onData(d); });
    c.on('close', function () {
      if (c !== conn) return;
      connected = false;
      dotState('err');
      setStatus('Motstanderen koblet fra.');
      render();
    });
    c.on('error', function () {});
  }

  function onData(data) {
    if (!data || typeof data !== 'object') return;

    if (data.type === 'move') {
      let res = null;
      try { res = chess.move(data.move); } catch (e) { res = null; }
      if (res) lastMove = { from: res.from, to: res.to };
      selected = null;
      legalTargets = new Set();
      render();
    } else if (data.type === 'reset') {
      resetGame(false);
    } else if (data.type === 'resign') {
      resignMsg = 'Motstanderen ga opp – du vant! 🎉';
      render();
    }
  }

  function showRoom(code, color) {
    lobbyEl.classList.add('hidden');
    roomInfo.classList.remove('hidden');
    gameBtns.classList.remove('hidden');
    codeText.textContent = code;
    colorText.textContent = color === 'w' ? 'Du spiller hvit' : 'Du spiller svart';
  }

  function hostGame(attempt) {
    attempt = attempt || 0;
    if (peer) { try { peer.destroy(); } catch (e) {} peer = null; }
    conn = null; connected = false; resignMsg = null;
    myColor = 'w';
    flipped = false;
    roomCode = randomCode();
    showRoom(roomCode, 'w');
    dotState('wait');
    setStatus('Oppretter rom …');

    peer = new Peer(PEER_PREFIX + roomCode.toLowerCase(), { debug: 1 });

    peer.on('open', function () {
      dotState('wait');
      setStatus('Venter på at noen blir med …');
      render();
    });

    peer.on('connection', function (c) {
      if (connected) { try { c.close(); } catch (e) {} return; }
      conn = c;
      attachConn(c);
    });

    peer.on('error', function (err) {
      if (err.type === 'unavailable-id' && attempt < 4) {
        try { peer.destroy(); } catch (e) {}
        setTimeout(function () { hostGame(attempt + 1); }, 350);
      } else if (err.type === 'unavailable-id') {
        dotState('err');
        setStatus('Klarte ikke å opprette rom. Prøv igjen.');
      } else {
        dotState('err');
        setStatus('Feil: ' + err.type);
      }
    });

    peer.on('disconnected', function () {
      try { peer.reconnect(); } catch (e) {}
    });
  }

  function joinGame(code) {
    code = (code || '').trim().toUpperCase();
    if (code.length !== 5) { setStatus('Romkoden må være 5 tegn.'); return; }

    if (peer) { try { peer.destroy(); } catch (e) {} }
    conn = null; connected = false; resignMsg = null;
    roomCode = code;
    myColor = 'b';
    flipped = true;
    showRoom(code, 'b');
    dotState('wait');
    setStatus('Kobler til rom ' + code + ' …');
    render();

    const target = PEER_PREFIX + code.toLowerCase();
    let tries = 0;
    peer = new Peer({ debug: 1 });

    peer.on('open', tryConnect);
    peer.on('error', function (err) {
      if (err.type === 'peer-unavailable' && !connected) {
        tries++;
        if (tries <= 10) {
          dotState('wait');
          setStatus('Kobler til … (forsøk ' + (tries + 1) + ')');
          setTimeout(tryConnect, 1000);
        } else {
          dotState('err');
          setStatus('Fant ikke rom «' + code + '». Sjekk koden, og at verten fortsatt venter.');
        }
      } else if (!connected) {
        dotState('err');
        setStatus('Tilkoblingsfeil: ' + err.type);
      }
    });

    function tryConnect() {
      if (connected || !peer || peer.destroyed) return;
      const c = peer.connect(target, { reliable: true });
      conn = c;
      attachConn(c);
    }
  }

  /* ---------- Knapper ---------- */
  document.getElementById('hostBtn').addEventListener('click', function () { hostGame(0); });
  document.getElementById('joinBtn').addEventListener('click', function () {
    joinGame(document.getElementById('roomInput').value);
  });
  document.getElementById('roomInput').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') joinGame(e.target.value);
  });
  document.getElementById('copyBtn').addEventListener('click', function () {
    if (!roomCode) return;
    const btn = this;
    const done = function () {
      btn.textContent = 'Kopiert!';
      setTimeout(function () { btn.textContent = 'Kopier kode'; }, 1400);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(roomCode).then(done, done);
    } else {
      const tmp = document.createElement('textarea');
      tmp.value = roomCode;
      document.body.appendChild(tmp);
      tmp.select();
      try { document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(tmp);
      done();
    }
  });
  document.getElementById('rematchBtn').addEventListener('click', function () { resetGame(true); });
  document.getElementById('resignBtn').addEventListener('click', function () {
    if (!connected || chess.game_over() || resignMsg) return;
    resignMsg = 'Du ga opp.';
    send({ type: 'resign' });
    render();
  });

  /* ---------- Start ---------- */
  render();
  window.addEventListener('beforeunload', function () { try { if (peer) peer.destroy(); } catch (e) {} });
})();
</script>
</body>
</html>
